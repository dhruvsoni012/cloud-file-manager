{% extends "layout.html" %}

{% block title %}Settings - Cloud File Manager{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">⚙️ Settings</h1>
</div>

{% if success %}
<div class="alert alert-success">{{ success }}</div>
{% endif %}

<form method="POST" class="settings-form">
    <!-- Theme Settings -->
    <div class="card">
        <h3 class="card-title">Appearance</h3>
        
        <div class="form-group">
            <label class="form-label">Theme</label>
            <select name="theme" class="form-select" onchange="previewTheme(this.value)">
                <option value="dark" {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
                <option value="light" {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label">Default View Mode</label>
            <select name="view_mode" class="form-select">
                <option value="grid" {% if settings.view_mode == 'grid' %}selected{% endif %}>Grid View</option>
                <option value="list" {% if settings.view_mode == 'list' %}selected{% endif %}>List View</option>
            </select>
        </div>
    </div>

    <!-- Navigation Settings -->
    <div class="card">
        <h3 class="card-title">Navigation</h3>
        
        <div class="form-group">
            <label class="form-label">Start Page</label>
            <select name="start_page" class="form-select">
                <option value="/" {% if settings.start_page == '/' %}selected{% endif %}>Home</option>
                <option value="/drive" {% if settings.start_page == '/drive' %}selected{% endif %}>My Drive</option>
                <option value="/trash" {% if settings.start_page == '/trash' %}selected{% endif %}>Trash</option>
            </select>
        </div>
    </div>

    <!-- Trash Settings -->
    <div class="card">
        <h3 class="card-title">Trash Management</h3>
        
        <div class="form-group">
            <label class="form-label">Auto-delete items after (days)</label>
            <input 
                type="number" 
                name="trash_days" 
                class="form-input" 
                value="{{ settings.trash_auto_delete_days }}" 
                min="1" 
                max="365"
            >
            <small class="form-help">Items in trash will be permanently deleted after this many days</small>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Save Settings</button>
</form>

<script>
function previewTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
}
</script>
{% endblock %}
